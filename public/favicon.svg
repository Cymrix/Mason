<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e1b4b" stroke-width="8"/>

  <!-- Blueprint Grid Pattern Sub-Layer -->
  <g stroke="#6366f1" stroke-opacity="0.14" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Mason Isometric Citadel / Architecture "M" Symbol -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <path d="M 120 380 L 120 160 L 184 120 L 184 340 Z" fill="#4f46e5" />
    <path d="M 184 120 L 224 144 L 224 364 L 184 340 Z" fill="#3730a3" />
    
    <!-- Central Apex Peak & Chevrons -->
    <path d="M 184 120 L 256 168 L 328 120 L 256 72 Z" fill="#818cf8" />
    <path d="M 224 200 L 256 220 L 288 200 L 256 180 Z" fill="#c7d2fe" />
    
    <!-- Right Pillar -->
    <path d="M 328 120 L 392 160 L 392 380 L 328 340 Z" fill="#6366f1" />
    <path d="M 288 144 L 328 120 L 328 340 L 288 364 Z" fill="#4338ca" />

    <!-- Center Keystone Keystone Pillar -->
    <path d="M 232 230 L 256 244 L 280 230 L 280 390 L 256 404 L 232 390 Z" fill="url(#indigoGrad)" />
  </g>

  <!-- Corner Blueprint Accents -->
  <path d="M 80 100 L 80 80 L 100 80" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 432 100 L 432 80 L 412 80" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 412 L 80 432 L 100 432" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 432 412 L 432 432 L 412 432" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
</svg>
