<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <filter id="pixelDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#pixelDropShadow)">
    <!-- Outer White / Light-Grey Border Contour -->
    <path 
      d="
        M 10 14 
        L 18 6 
        L 32 18 
        L 46 6 
        L 54 14 
        L 54 52 
        L 46 44 
        L 32 58 
        L 18 44 
        L 10 52 
        Z
      "
      fill="#f8fafc"
      stroke="#cbd5e1"
      stroke-width="1.5"
      stroke-linejoin="miter"
    />

    <!-- Navy Blue Inner Masonry Body -->
    <path 
      d="
        M 12 15 
        L 18 9 
        L 32 20 
        L 46 9 
        L 52 15 
        L 52 50 
        L 46 44 
        L 32 56 
        L 18 44 
        L 12 50 
        Z
      "
      fill="#163868"
    />

    <!-- Blueprint Masonry Mortar Grid (Light Slate Blue) -->
    <g stroke="#4f80ad" stroke-width="1.2" stroke-linecap="square" opacity="0.95">
      <!-- Vertical Column Seams -->
      <line x1="18" y1="9" x2="18" y2="44" />
      <line x1="25" y1="14" x2="25" y2="50" />
      <line x1="32" y1="20" x2="32" y2="56" />
      <line x1="39" y1="14" x2="39" y2="50" />
      <line x1="46" y1="9" x2="46" y2="44" />

      <!-- Chevron Mortar Lines (pointing DOWN to center) -->
      <line x1="12" y1="22" x2="32" y2="34" />
      <line x1="52" y1="22" x2="32" y2="34" />

      <line x1="12" y1="29" x2="32" y2="41" />
      <line x1="52" y1="29" x2="32" y2="41" />

      <line x1="12" y1="36" x2="32" y2="48" />
      <line x1="52" y1="36" x2="32" y2="48" />

      <line x1="12" y1="43" x2="32" y2="55" />
      <line x1="52" y1="43" x2="32" y2="55" />
    </g>

    <!-- Central White / Platinum 'M' Monogram (Proper upright 'M' orientation) -->
    <path 
      d="
        M 19 18
        L 23 18
        L 32 28
        L 41 18
        L 45 18
        L 45 44
        L 41 44
        L 41 24
        L 32 34
        L 23 24
        L 23 44
        L 19 44
        Z
      "
      fill="#ffffff"
    />

    <!-- Top Apex Highlights -->
    <polygon points="18,6 20,8 18,10 16,8" fill="#ffffff" opacity="0.6" />
    <polygon points="46,6 48,8 46,10 44,8" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
