<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mason — HUD & UI Theme Forge (modules/ui)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">
  <!-- Module Header Bar -->
  <header class="h-12 border-b border-neutral-800 bg-neutral-900/90 px-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-amber-950 border border-amber-500/40 flex items-center justify-center text-sm">
        💎
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-neutral-100">HUD & UI Theme Forge</span>
          <span class="text-[10px] font-mono bg-neutral-800 text-amber-400 px-1.5 py-0.5 rounded">modules/ui/</span>
        </div>
      </div>
    </div>

    <!-- Active UI Theme & Actions -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-neutral-950 px-3 py-1 rounded-lg border border-neutral-800 text-xs font-mono">
        <span class="text-neutral-500">Theme:</span>
        <span class="text-amber-300 font-bold">Gothic Obsidian & Ruby</span>
        <span class="text-neutral-500 text-[10px]">(.ui)</span>
      </div>

      <button id="btn-save-ui" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition">
        <span>💾 Save UI Theme</span>
      </button>
    </div>
  </header>

  <!-- Live In-Game HUD Simulation Canvas -->
  <div class="flex-1 flex overflow-hidden">
    <main class="flex-1 bg-neutral-950 p-6 flex flex-col gap-5 overflow-y-auto">
      <!-- Simulated Gameplay Screen with HUD Overlays -->
      <div class="relative h-80 rounded-2xl border border-neutral-800 bg-neutral-950 shadow-2xl flex flex-col justify-between p-5 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-neutral-900/50 to-black pointer-events-none"></div>

        <!-- Top HUD Elements -->
        <div class="relative z-10 flex items-start justify-between">
          <!-- Health Orb -->
          <div class="flex items-center gap-3">
            <div class="relative w-16 h-16 rounded-full border-2 border-amber-600/70 bg-black flex items-center justify-center shadow-xl overflow-hidden">
              <div class="absolute bottom-0 inset-x-0 bg-red-600 transition-all duration-300" style="height: 75%;"></div>
              <span class="relative z-10 font-bold text-xs text-white font-mono drop-shadow">75 HP</span>
            </div>

            <div class="space-y-1">
              <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span>
                <div class="w-32 h-2.5 bg-neutral-900 rounded-full border border-white/20 overflow-hidden">
                  <div class="h-full bg-blue-500 w-3/4"></div>
                </div>
                <span class="text-[10px] font-mono text-blue-300 font-bold">40/60 MP</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                <div class="w-32 h-2 bg-neutral-900 rounded-full border border-white/20 overflow-hidden">
                  <div class="h-full bg-emerald-500 w-4/5"></div>
                </div>
                <span class="text-[10px] font-mono text-emerald-300 font-bold">90 SP</span>
              </div>
            </div>
          </div>

          <!-- Boss Bar -->
          <div class="w-64 bg-black/80 p-2 rounded-xl border border-red-500/40 text-center space-y-1 backdrop-blur shadow-xl">
            <span class="text-[10px] font-black tracking-widest text-red-400 uppercase">IGNIS ARCHON • PYRE LORD</span>
            <div class="w-full h-2.5 bg-neutral-950 rounded border border-white/20 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-red-600 to-amber-500 w-2/3"></div>
            </div>
          </div>

          <!-- Circular Minimap -->
          <div class="w-24 h-24 rounded-full border-2 border-cyan-500/70 bg-black/80 flex items-center justify-center relative shadow-xl">
            <div class="text-center">
              <span class="text-cyan-400 text-xs">🧭</span>
              <span class="text-[8px] text-neutral-400 font-mono block">SECTOR A</span>
            </div>
          </div>
        </div>

        <!-- Bottom Dialogue Preview -->
        <div class="relative z-10 p-3 rounded-xl border border-amber-600/40 bg-neutral-900/90 backdrop-blur flex items-center gap-3 shadow-2xl max-w-lg mx-auto">
          <div class="w-9 h-9 rounded-lg bg-neutral-800 border border-white/20 flex items-center justify-center text-base">🧙‍♂️</div>
          <div>
            <span class="text-[10px] font-bold text-amber-400 uppercase block">Elder Korvath</span>
            <p class="text-xs text-neutral-200">"The magma vents require the Aether Wings to cross safely..."</p>
          </div>
        </div>
      </div>

      <!-- Theme Options -->
      <div class="bg-neutral-900/90 border border-neutral-800 rounded-2xl p-5 space-y-3">
        <h3 class="text-xs font-bold text-neutral-200 uppercase tracking-wider">HUD Theme Presets</h3>
        <div class="grid grid-cols-2 gap-3 text-xs">
          <button class="p-3 rounded-xl bg-amber-950/60 border border-amber-500/60 text-amber-200 text-left font-bold">
            ✓ Gothic Obsidian & Ruby Orb
          </button>
          <button class="p-3 rounded-xl bg-neutral-950 border border-neutral-800 text-neutral-400 text-left hover:text-white transition">
            Cybernetic Neon & Glass Gauge
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('btn-save-ui').addEventListener('click', () => {
      window.parent.postMessage({
        type: 'MASON_MODULE_EVENT',
        module: 'ui',
        event: 'SAVE_FILE'
      }, '*');
      const btn = document.getElementById('btn-save-ui');
      btn.innerText = '✓ Saved!';
      setTimeout(() => { btn.innerText = '💾 Save UI Theme'; }, 1500);
    });
  </script>
</body>
</html>
